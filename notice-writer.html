<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notice Writer – Wexla Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #090a0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        button { background: linear-gradient(45deg,#00f2ff,#ff00cc); border: none; color: white; padding: 15px; width: 100%; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .notice-box { margin-top: 30px; border: 2px solid white; padding: 20px; color: black; background: white; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📢 Notice Writer</h2>
        <input id="org" placeholder="School/Institution Name">
        <input id="topic" placeholder="Topic">
        <textarea id="msg" placeholder="Content..."></textarea>
        <button onclick="gen()">Generate Notice</button>

        <div id="box" class="notice-box">
            <b id="o"></b><br>NOTICE<br>
            <div style="text-align:right" id="d"></div><br>
            <u id="t"></u><br><br>
            <div id="m" style="text-align:left"></div><br>
            <div style="text-align:left"><b>Authority</b></div>
        </div>
    </div>
    <script>
        function gen(){
            document.getElementById('o').innerText = document.getElementById('org').value.toUpperCase();
            document.getElementById('t').innerText = document.getElementById('topic').value.toUpperCase();
            document.getElementById('m').innerText = document.getElementById('msg').value;
            document.getElementById('d').innerText = "Date: " + new Date().toLocaleDateString();
            document.getElementById('box').style.display = "block";
        }
    </script>
</body>
</html>
