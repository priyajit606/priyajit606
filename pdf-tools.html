<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to PDF – Wexla Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>/* Same Premium Styles as above */</style>
</head>
<body>
    <div class="tool-card">
        <h2 style="background: linear-gradient(to right, #00f2ff, #ff00cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🖼️ Image to PDF</h2>
        <input type="file" id="imgInp" accept="image/*">
        <button onclick="makePDF()">Convert to PDF</button>
        <p id="msg" style="margin-top:10px; color:#00f2ff;"></p>
    </div>
    <script>
        function makePDF() {
            const inp = document.getElementById('imgInp').files[0];
            if(!inp) return alert("Select an image!");
            const reader = new FileReader();
            reader.onload = function(e) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    doc.addImage(img, 'JPEG', 10, 10, 190, 150);
                    doc.save("Wexla_Converted.pdf");
                    document.getElementById('msg').innerText = "Successfully Downloaded!";
                }
            };
            reader.readAsDataURL(inp);
        }
    </script>
</body>
</html>
