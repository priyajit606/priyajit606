<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to Text PDF – Wexla Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>/* Use same CSS as Application Writer */</style>
</head>
<body>
    <div class="tool-card">
        <h2>📄 Image to Text PDF</h2>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 15px;">Paste extracted text here to save as a professional PDF</p>
        <textarea class="input" id="textInput" placeholder="Enter or paste text here..."></textarea>
        <button onclick="savePDF()">Download as PDF</button>
    </div>
    <script>
        async function savePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById("textInput").value || "No content provided.";
            doc.text(text, 10, 10);
            doc.save("Wexla_Text_File.pdf");
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to Text PDF – Wexla Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle, #1b2735 0%, #090a0f 100%); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://www.transparenttextures.com'); opacity: 0.3; z-index: -1; }
        .tool-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; }
        h2 { background: linear-gradient(to right, #00f2ff, #ff00cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 10px; }
        button { background: linear-gradient(45deg, #00f2ff, #ff00cc); border: none; color: white; padding: 15px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        #status { margin: 15px 0; color: #00f2ff; font-weight: bold; }
        textarea { width: 100%; height: 150px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #444; border-radius: 10px; padding: 10px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="tool-card">
        <a href="index.html" style="color:#00f2ff; text-decoration:none; float:left;">← Back</a><br>
        <h2>📄 Image to Text PDF</h2>
        <input type="file" id="upload" accept="image/*">
        <button onclick="extractText()">Extract & Download PDF</button>
        <div id="status">Ready</div>
        <textarea id="outText"></textarea>
    </div>

    <script>
        async function extractText() {
            const file = document.getElementById('upload').files[0];
            if (!file) return alert("Please select an image!");
            
            const status = document.getElementById('status');
            status.innerText = "Processing... Please wait (OCR)";
            
            Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
                status.innerText = "Done! Downloading PDF...";
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text(text, 10, 10, { maxWidth: 180 });
                doc.save("Wexla_Extracted.pdf");
                
                document.getElementById('outText').style.display = "block";
                document.getElementById('outText').value = text;
            });
        }
    </script>
</body>
</html>
