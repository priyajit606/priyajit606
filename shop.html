<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wexla Arcade - Snake Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }
        .back-btn:hover { border-color: #00f2ff; box-shadow: 0 0 10px #00f2ff; }
        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00cc;
        }
        #score { color: #00f2ff; }
        #highScore { color: #ffd700; }
        
        .game-container {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00f2ff;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
            overflow: hidden;
        }
        canvas { display: block; background: #0b0f19; }
        
        /* Mobile Touch Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) { .controls { display: none; } }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .btn:active { background: linear-gradient(45deg, #00f2ff, #ff00cc); border-color: transparent; }
        #up-btn { grid-column: 2; }
        #left-btn { grid-column: 1; grid-row: 2; }
        #right-btn { grid-column: 3; grid-row: 2; }
        #down-btn { grid-column: 2; grid-row: 3; }

        .game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .game-over-screen h2 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #ff00cc, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .play-btn {
            background: linear-gradient(45deg, #00f2ff, #ff00cc);
            border: none; color: white; padding: 12px 30px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px #00f2ff; transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header">
        <a href="shop.html" class="back-btn"><i class="fas fa-arrow-left"></i> Arcade</a>
        <div class="score-board">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="highScore">0</span></div>
        </div>
    </div>

    <div class="game-container">
        <div class="game-over-screen" id="gameOver">
            <h2>GAME OVER</h2>
            <p style="margin-bottom: 20px; opacity: 0.8;">Great try! Play again?</p>
            <button class="play-btn" onclick="resetGame()">Start Game</button>
        </div>
        <canvas id="gameCanvas" width="340" height="340"></canvas>
    </div>

    <div class="controls">
        <div class="btn" id="up-btn" onclick="changeDir('UP')"><i class="fas fa-chevron-up"></i></div>
        <div class="btn" id="left-btn" onclick="changeDir('LEFT')"><i class="fas fa-chevron-left"></i></div>
        <div class="btn" id="right-btn" onclick="changeDir('RIGHT')"><i class="fas fa-chevron-right"></i></div>
        <div class="btn" id="down-btn" onclick="changeDir('DOWN')"><i class="fas fa-chevron-down"></i></div>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20; // Size of grid blocks
        let snake, food, d, score, gameInterval;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        // Start initialization
        resetGame();

        function resetGame() {
            document.getElementById("gameOver").style.display = "none";
            snake = [{ x: 8 * box, y: 8 * box }];
            generateFood();
            d = undefined;
            score = 0;
            document.getElementById("score").innerText = score;
            
            clearInterval(gameInterval);
            gameInterval = setInterval(draw, 130); // Speed control
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
            // Prevent food from spawning on snake's body
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) generateFood();
            }
        }

        // Keyboard Event Listener
        document.addEventListener("keydown", direction);
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        // Mobile Controls click logic
        function changeDir(dir) {
            if (dir == "LEFT" && d != "RIGHT") d = "LEFT";
            else if (dir == "UP" && d != "DOWN") d = "UP";
            else if (dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            else if (dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        // Main Draw Loop Execution
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Snake Body
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i == 0 ? "#00f2ff" : "#ff00cc"; // Glowing Neon head and tail
                ctx.strokeStyle = "#0b0f19";
                ctx.shadowBlur = 15;
                ctx.shadowColor = i == 0 ? "#00f2ff" : "#ff00cc";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Draw Food Element
            ctx.fillStyle = "#ffd700"; // Gold color food
            ctx.shadowColor = "#ffd700";
            ctx.fillRect(food.x, food.y, box, box);
            ctx.shadowBlur = 0; // Reset shadows for performance

            // Capture Head Position
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Update Direction positions
            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // Handle Snake eating food mechanism
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("score").innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }
                generateFood();
            } else {
                snake.pop(); // Remove the tail cell
            }

            // Core Head Collision coordinates rules
            let newHead = { x: snakeX, y: snakeY };

            // Game Over Boundary Conditions & Self collision Check
            if (
                snakeX < 0 || snakeY < 0 || 
                snakeX >= canvas.width || snakeY >= canvas.height || 
                collision(newHead, snake)
            ) {
                clearInterval(gameInterval);
                document.getElementById("gameOver").style.display = "flex";
                return;
            }

            snake.unshift(newHead);
        }
    </script>
</body>
</html>
