<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JPG to PNG – Wexla Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Shared Design */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #090a0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .tool-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        h2 { background: linear-gradient(to right, #00f2ff, #ff00cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input[type="file"] { margin-bottom: 20px; width: 100%; }
        button { background: linear-gradient(45deg, #00f2ff, #ff00cc); border: none; color: white; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 100%; }
        .back-link { position: absolute; top: 20px; left: 20px; color: #00f2ff; text-decoration: none; }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">← Back</a>
    <div class="tool-card">
        <h2>🔄 JPG to PNG</h2>
        <input type="file" id="img" accept=".jpg,.jpeg">
        <button onclick="convert()">Convert to PNG</button>
        <a id="down" style="display:block; margin-top:15px; color:#ff00cc; text-decoration:none;"></a>
    </div>
    <canvas id="c" style="display:none"></canvas>
    <script>
        function convert(){
            let f=document.getElementById("img").files[0];
            if(!f) return alert("Select a JPG!");
            let img=new Image();
            img.src=URL.createObjectURL(f);
            img.onload=()=>{
                let c=document.getElementById("c");
                c.width=img.width; c.height=img.height;
                c.getContext("2d").drawImage(img,0,0);
                c.toBlob(b=>{
                    let a=document.getElementById("down");
                    a.href=URL.createObjectURL(b);
                    a.download="wexla_converted.png";
                    a.innerText="Download PNG File ↓";
                },"image/png");
            }
        }
    </script>
</body>
</html>
